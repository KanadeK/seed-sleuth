name: Bug report
description: Report a reproducible SeedSleuth defect.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove proprietary world data and secrets before attaching evidence.
  - type: input
    id: version
    attributes:
      label: SeedSleuth version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: adapter
    attributes:
      label: Adapter kind
      options:
        - Module
        - Command
        - Standalone world validation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command, seed, minimized config, and observed exit code.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node version, and relevant generator version.
    validations:
      required: true
