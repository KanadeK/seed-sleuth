  <text x="68" y="156" fill="#f4f0e7" font-family="system-ui,sans-serif" font-size="66" font-weight="800" letter-spacing="-3">Find the seed that</text>
  <text x="68" y="222" fill="#f4f0e7" font-family="system-ui,sans-serif" font-size="66" font-weight="800" letter-spacing="-3">breaks the world.</text>
  <g transform="translate(72 280)">
