<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">SeedSleuth procedural world evidence</title>
  <desc id="description">A healthy connected dungeon beside a failing disconnected dungeon, with a seed sweep result summary.</desc>
  <rect width="1200" height="630" fill="#0c0f0e"/>
  <circle cx="117" cy="14" r="310" fill="#344126" opacity=".62"/>
  <path d="M0 94h1200M0 536h1200" stroke="#303632"/>
