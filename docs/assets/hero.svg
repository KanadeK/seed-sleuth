      <path d="M18 18h72v18h36v18h54v18h72v18h-36v18H90V90H54V72H18z" fill="#d7d0bd"/>
      <rect x="27" y="20" width="18" height="18" fill="#d5ff64"/>
      <rect x="225" y="74" width="18" height="18" fill="#ff835c"/>
      <path d="M36 29h54v18h45v18h54v18h45" fill="none" stroke="#68d8d6" stroke-width="4" stroke-dasharray="4 5"/>
