  </g>
  <g transform="translate(414 280)">
    <rect width="314" height="202" rx="3" fill="#171a19" stroke="#ff6b75"/>
    <text x="18" y="30" fill="#ff6b75" font-family="monospace" font-size="12">SEED 1017 · VIOLATION</text>
    <g transform="translate(18 46)">
      <path d="M0 0h270v126H0z" fill="#0a0c0b"/>
      <path d="M18 18h72v18h36v18h36V36h90v36h-36v18h-54v18H90V90H54V72H18z" fill="#d7d0bd"/>
